name: employee-management-dev

x-api-environment: &api-environment
  NODE_ENV: development
  PORT: "4000"
  MONGODB_URI: mongodb://mongodb:27017/employee_management
  JWT_SECRET: ${JWT_SECRET:-docker-compose-development-secret-change-before-deploy}
  JWT_EXPIRES_IN: 8h
  CLIENT_ORIGIN: http://localhost:4200
  ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-dev-password-123}

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - mongodb://localhost:27017/admin
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    init: true
    restart: unless-stopped
    command: npm run dev
    environment: *api-environment
    ports:
      - "4000:4000"
    volumes:
      - ./api:/workspace/api
      - api_node_modules:/workspace/api/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile.dev
    init: true
    restart: unless-stopped
    command: npm run start:docker
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "4200:4200"
    volumes:
      - ./client:/workspace/client
      - client_node_modules:/workspace/client/node_modules
    depends_on:
      api:
        condition: service_healthy

  seed:
    profiles:
      - tools
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    command: npm run seed
    environment: *api-environment
    volumes:
      - ./api:/workspace/api
      - api_node_modules:/workspace/api/node_modules
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
  api_node_modules:
  client_node_modules:
