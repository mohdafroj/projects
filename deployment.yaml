apiVersion: apps/v1
kind: Deployment

metadata:
  name: trafficlight

spec:
  replicas: 2

  selector:
    matchLabels:
      app: trafficlight

  template:
    metadata:
      labels:
        app: trafficlight

    spec:
      containers:
        - name: trafficlight
          image: trafficlight:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000